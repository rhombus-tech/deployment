[package]
name = "evm-verify"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "common",
    "contracts",
    "pcd",
    "pcc",
]

[features]
default = ["pcd", "pcc"]
pcd = ["dep:pcd"]
pcc = ["dep:pcc"]
accumulation = ["pcd/accumulation"]
all = ["pcd", "pcc", "accumulation"]

[dependencies]
# Internal dependencies
evm-verify-common = { path = "./common" }
pcd = { path = "./pcd", optional = true }
pcc = { path = "./pcc", optional = true }

# Ethereum
ethers = { version = "2.0", features = ["ws"] }
ethereum-types = "0.14"
rlp = "0.5"
tiny-keccak = { version = "2.0", features = ["keccak"] }
hex = "0.4"
hex-literal = "0.4"

# Cryptographic proof systems
ark-ff = "0.4"
ark-ec = "0.4"
ark-bn254 = { version = "0.4" }
ark-bls12-381 = "0.4"
ark-std = { version = "0.4" }
ark-r1cs-std = { version = "0.4" }
ark-relations = { version = "0.4" }
ark-groth16 = { version = "0.4" }
ark-snark = "0.4.0"
ark-serialize = "0.4.0"

# Error handling and utilities
anyhow = "1.0"
blake3 = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Randomness
rand = "0.8"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Temporary files for testing
tempfile = "3.8"

[dev-dependencies]
hex-literal = "0.4"
