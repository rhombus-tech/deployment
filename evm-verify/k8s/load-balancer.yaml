apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-lb-config
  namespace: zkevm-system
  labels:
    app.kubernetes.io/name: nginx-lb
    app.kubernetes.io/component: config
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    
    # Optimize for high-performance zkEVM proving
    worker_rlimit_nofile 100000;
    
    events {
        worker_connections 10000;
        use epoll;
        multi_accept on;
        accept_mutex off;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Logging format optimized for zkEVM analytics
        log_format zkevm_format '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time uct="$upstream_connect_time" '
                                'uht="$upstream_header_time" urt="$upstream_response_time" '
                                'proving_time="$upstream_http_x_proving_time" '
                                'proof_size="$upstream_http_x_proof_size"';
        
        access_log /var/log/nginx/access.log zkevm_format;
        
        # Performance optimizations
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        keepalive_requests 10000;
        client_body_timeout 60;
        client_header_timeout 60;
        send_timeout 60;
        
        # Compression for API responses
        gzip on;
        gzip_vary on;
        gzip_min_length 1000;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml
            text/plain
            text/css
            text/xml
            text/javascript;
        
        # Enhanced Rate Limiting Zones
        # High-frequency API endpoints (proving, analysis)
        limit_req_zone $binary_remote_addr zone=api_critical:10m rate=100r/m;  # Critical operations
        limit_req_zone $binary_remote_addr zone=api_sustained:10m rate=300r/m; # Sustained load
        limit_req_zone $binary_remote_addr zone=api_burst:10m rate=1000r/m;    # Burst handling
        
        # Demo and public endpoints
        limit_req_zone $binary_remote_addr zone=demo:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=public:10m rate=50r/m;
        
        # Connection limiting
        limit_conn_zone $binary_remote_addr zone=perip:10m;           # Per-IP connection limit
        limit_conn_zone $server_name zone=global:10m;                # Global connection limit
        
        # DDoS Protection - Request size limits
        client_max_body_size 1M;                                     # Max request body
        client_body_buffer_size 128k;                                # Request body buffer
        client_header_buffer_size 1k;                                # Header buffer
        large_client_header_buffers 4 4k;                            # Large header buffers
        
        # DDoS Protection - Timing limits
        client_body_timeout 10s;                                     # Body timeout
        client_header_timeout 10s;                                   # Header timeout
        send_timeout 10s;                                             # Send timeout
        
        # Geographic and IP-based filtering
        geo $blocked_country {
            default 0;
            # Add countries to block if needed
            # CN 1;  # Example: Block China
            # RU 1;  # Example: Block Russia
        }
        
        # Bot detection and rate limiting
        map $http_user_agent $bad_bot {
            default 0;
            ~*bot 1;
            ~*crawl 1;
            ~*spider 1;
            ~*scraper 1;
            ~*scanner 1;
            "" 1;  # Empty user agent
        }
        
        # Upstream definitions with health checks
        upstream zkevm_backend {
            least_conn;
            keepalive 32;
            keepalive_requests 1000;
            
            # zkEVM server instances
            server zkevm-service:8080 max_fails=3 fail_timeout=30s weight=10;
            
            # Health check configuration
            check interval=5000 rise=2 fall=3 timeout=3000 type=http;
            check_http_send "GET /health HTTP/1.0\r\n\r\n";
            check_http_expect_alive http_2xx http_3xx;
        }
        
        upstream zkevm_metrics {
            server zkevm-service:9090 max_fails=2 fail_timeout=10s;
        }
        
        upstream zkevm_demo {
            server zkevm-demo-service:3000 max_fails=2 fail_timeout=10s;
        }
        
        # Security headers map
        map $sent_http_content_type $security_headers {
            default "X-Content-Type-Options: nosniff; X-Frame-Options: DENY; X-XSS-Protection: 1; mode=block; Referrer-Policy: strict-origin-when-cross-origin";
        }
        
        # Main API server
        server {
            listen 80;
            listen 443 ssl http2;
            server_name api.zkevm.example.com zkvm.example.com;
            
            # SSL configuration
            ssl_certificate /etc/ssl/certs/tls.crt;
            ssl_certificate_key /etc/ssl/private/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
            ssl_prefer_server_ciphers off;
            ssl_session_cache shared:SSL:10m;
            ssl_session_timeout 10m;
            
            # Security headers
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy no-referrer-when-downgrade always;
            add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; font-src 'self' data: https:; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https: wss:;" always;
            
            # DDoS Protection - Block bad actors
            if ($blocked_country) {
                return 403 "Access denied from this location";
            }
            
            if ($bad_bot) {
                return 403 "Bot access not allowed";
            }
            
            # Enhanced Rate limiting with multiple layers
            limit_req zone=api_sustained burst=100 nodelay;  # Sustained requests
            limit_req zone=api_burst burst=20 nodelay;       # Burst protection  
            limit_conn perip 50;                             # Connection limit per IP
            limit_conn global 10000;                         # Global connection limit
            
            # API endpoints
            location /api/v1/prove {
                # Critical endpoint - stricter rate limiting
                limit_req zone=api_critical burst=10 nodelay;
                limit_conn perip 5;  # Limit proving connections per IP
                
                proxy_pass http://zkevm_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Proving-specific timeouts
                proxy_connect_timeout 5s;
                proxy_send_timeout 30s;
                proxy_read_timeout 120s;  # Allow time for complex proofs
                
                # Enable response buffering for performance
                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 4k;
                
                # Add proving metrics to response headers
                add_header X-Proving-Node $upstream_addr always;
                add_header X-Response-Time $upstream_response_time always;
            }
            
            location /api/v1/analyze {
                proxy_pass http://zkevm_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Analysis can take longer
                proxy_read_timeout 300s;
            }
            
            location /health {
                access_log off;
                proxy_pass http://zkevm_backend/health;
                proxy_set_header Host $host;
                proxy_connect_timeout 3s;
                proxy_send_timeout 3s;
                proxy_read_timeout 3s;
            }
            
            location /ready {
                access_log off;
                proxy_pass http://zkevm_backend/ready;
                proxy_set_header Host $host;
            }
            
            location /metrics {
                access_log off;
                proxy_pass http://zkevm_metrics/metrics;
                proxy_set_header Host $host;
                
                # Restrict metrics access
                allow 10.0.0.0/8;
                allow 172.16.0.0/12;
                allow 192.168.0.0/16;
                deny all;
            }
            
            # WebSocket support for real-time updates
            location /ws {
                proxy_pass http://zkevm_backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # WebSocket timeouts
                proxy_connect_timeout 7s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }
        }
        
        # Demo playground server
        server {
            listen 80;
            listen 443 ssl http2;
            server_name demo.zkevm.example.com;
            
            # SSL configuration
            ssl_certificate /etc/ssl/certs/tls.crt;
            ssl_certificate_key /etc/ssl/private/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
            ssl_prefer_server_ciphers off;
            
            # Security headers
            add_header $security_headers always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            
            # Demo-specific rate limiting
            limit_req zone=demo burst=20 nodelay;
            limit_conn perip 10;
            
            location / {
                proxy_pass http://zkevm_demo;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Demo timeouts
                proxy_connect_timeout 10s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
            
            # Proxy API calls to main backend
            location /api/ {
                proxy_pass http://zkevm_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # API timeouts
                proxy_connect_timeout 5s;
                proxy_send_timeout 30s;
                proxy_read_timeout 120s;
            }
        }
        
        # Status and monitoring endpoints
        server {
            listen 8080;
            server_name localhost;
            
            location /nginx_status {
                stub_status on;
                access_log off;
                allow 127.0.0.1;
                allow 10.0.0.0/8;
                deny all;
            }
            
            location /upstream_status {
                check_status;
                access_log off;
                allow 127.0.0.1;
                allow 10.0.0.0/8;
                deny all;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zkevm-load-balancer
  namespace: zkevm-system
  labels:
    app.kubernetes.io/name: nginx-lb
    app.kubernetes.io/component: load-balancer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-lb
      app.kubernetes.io/component: load-balancer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-lb
        app.kubernetes.io/component: load-balancer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/nginx_status"
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        - containerPort: 8080
          name: status
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: tls-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        - name: tls-private
          mountPath: /etc/ssl/private
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /nginx_status
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /nginx_status
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-lb-config
      - name: tls-certs
        secret:
          secretName: zkevm-tls
      - name: tls-private
        secret:
          secretName: zkevm-tls
---
apiVersion: v1
kind: Service
metadata:
  name: zkevm-load-balancer
  namespace: zkevm-system
  labels:
    app.kubernetes.io/name: nginx-lb
    app.kubernetes.io/component: service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
  - 0.0.0.0/0
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  - port: 443
    targetPort: https
    protocol: TCP
    name: https
  selector:
    app.kubernetes.io/name: nginx-lb
    app.kubernetes.io/component: load-balancer
