apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zkevm-ingress
  namespace: zkevm-system
  labels:
    app.kubernetes.io/name: zkevm
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$binary_remote_addr"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  tls:
  - hosts:
    - api.zkevm.example.com
    - zkvm.example.com
    - demo.zkevm.example.com
    secretName: zkevm-tls-ingress
  rules:
  # Main API endpoint
  - host: api.zkevm.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zkevm-service
            port:
              number: 8080
      - path: /health
        pathType: Exact
        backend:
          service:
            name: zkevm-service
            port:
              number: 8080
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: zkevm-service
            port:
              number: 9090
  
  # Load balancer endpoint
  - host: zkvm.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zkevm-load-balancer
            port:
              number: 80
  
  # Demo playground endpoint
  - host: demo.zkevm.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zkevm-demo-service
            port:
              number: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zkevm-network-policy
  namespace: zkevm-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zkevm
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  # Allow traffic from monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  # Allow inter-pod communication
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zkevm
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS outbound (for Ethereum RPC)
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP outbound
  - to: []
    ports:
    - protocol: TCP
      port: 80
  # Allow communication with other pods
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zkevm
