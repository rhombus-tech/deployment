apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: zkevm-system
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'zkevm-production'
        environment: 'production'
    
    rule_files:
      - "/etc/prometheus/rules/*.yml"
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093
    
    scrape_configs:
    # ZKEVM application metrics
    - job_name: 'zkevm-server'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - zkevm-system
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
    
    # Kubernetes cluster metrics
    - job_name: 'kubernetes-apiservers'
      kubernetes_sd_configs:
      - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https
    
    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics
    
    - job_name: 'kubernetes-cadvisor'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
    
    # Custom ZKEVM metrics
    - job_name: 'zkevm-custom-metrics'
      static_configs:
      - targets: ['zkevm-service:9090']
      scrape_interval: 5s
      metrics_path: /metrics
      relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'zkevm-production'
  
  rules.yml: |
    groups:
    - name: zkevm.rules
      rules:
      # Proving performance rules
      - record: zkevm:proving_rate_5m
        expr: rate(zkevm_proofs_generated_total[5m])
      
      - record: zkevm:avg_proving_time_5m
        expr: rate(zkevm_proving_time_seconds_sum[5m]) / rate(zkevm_proving_time_seconds_count[5m])
      
      - record: zkevm:success_rate_5m
        expr: rate(zkevm_proofs_successful_total[5m]) / rate(zkevm_proofs_total[5m])
      
      # Resource utilization rules
      - record: zkevm:memory_utilization
        expr: (container_memory_working_set_bytes{container="zkevm-server"} / container_spec_memory_limit_bytes{container="zkevm-server"}) * 100
      
      - record: zkevm:cpu_utilization
        expr: rate(container_cpu_usage_seconds_total{container="zkevm-server"}[5m]) * 100
      
      # Application health rules
      - record: zkevm:uptime_percentage_24h
        expr: avg_over_time(up{job="zkevm-server"}[24h]) * 100
    
    - name: zkevm.alerts
      rules:
      # Critical alerts
      - alert: ZKEVMServiceDown
        expr: up{job="zkevm-server"} == 0
        for: 1m
        labels:
          severity: critical
          component: zkevm-server
        annotations:
          summary: "ZKEVM service is down"
          description: "ZKEVM service has been down for more than 1 minute"
      
      - alert: ZKEVMHighErrorRate
        expr: zkevm:success_rate_5m < 0.95
        for: 5m
        labels:
          severity: critical
          component: zkevm-proving
        annotations:
          summary: "ZKEVM proving error rate is high"
          description: "ZKEVM proving success rate is {{ $value }}% which is below 95%"
      
      - alert: ZKEVMSlowProving
        expr: zkevm:avg_proving_time_5m > 1.0
        for: 10m
        labels:
          severity: warning
          component: zkevm-proving
        annotations:
          summary: "ZKEVM proving is slow"
          description: "Average proving time is {{ $value }}s which is above 1s threshold"
      
      # Resource alerts
      - alert: ZKEVMHighMemoryUsage
        expr: zkevm:memory_utilization > 90
        for: 5m
        labels:
          severity: warning
          component: zkevm-resources
        annotations:
          summary: "ZKEVM memory usage is high"
          description: "Memory utilization is {{ $value }}% which is above 90%"
      
      - alert: ZKEVMHighCPUUsage
        expr: zkevm:cpu_utilization > 80
        for: 10m
        labels:
          severity: warning
          component: zkevm-resources
        annotations:
          summary: "ZKEVM CPU usage is high"
          description: "CPU utilization is {{ $value }}% which is above 80%"
      
      # Performance alerts
      - alert: ZKEVMLowThroughput
        expr: zkevm:proving_rate_5m < 100
        for: 15m
        labels:
          severity: warning
          component: zkevm-performance
        annotations:
          summary: "ZKEVM throughput is low"
          description: "Proving rate is {{ $value }} proofs/sec which is below 100"
