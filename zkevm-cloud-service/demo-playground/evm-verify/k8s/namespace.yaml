apiVersion: v1
kind: Namespace
metadata:
  name: zkevm-system
  labels:
    name: zkevm-system
    app.kubernetes.io/name: zkevm
    app.kubernetes.io/part-of: zkevm-infrastructure
    app.kubernetes.io/version: "1.0.0"
  annotations:
    description: "ZODA-WARP zkEVM production deployment namespace"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: zkevm-resource-quota
  namespace: zkevm-system
spec:
  hard:
    requests.cpu: "50"
    requests.memory: 100Gi
    limits.cpu: "100"
    limits.memory: 200Gi
    persistentvolumeclaims: "10"
    services: "20"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: zkevm-limit-range
  namespace: zkevm-system
spec:
  limits:
  - default:
      cpu: "2"
      memory: "4Gi"
    defaultRequest:
      cpu: "500m"
      memory: "1Gi"
    type: Container
  - default:
      storage: "10Gi"
    type: PersistentVolumeClaim
