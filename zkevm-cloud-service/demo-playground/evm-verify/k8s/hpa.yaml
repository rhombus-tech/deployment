apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zkevm-hpa
  namespace: zkevm-system
  labels:
    app.kubernetes.io/name: zkevm
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zkevm-deployment
  minReplicas: 3
  maxReplicas: 50
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Custom metrics for proving requests
  - type: Pods
    pods:
      metric:
        name: zkevm_active_proofs_per_pod
      target:
        type: AverageValue
        averageValue: "10"
  # Request rate based scaling
  - type: Object
    object:
      metric:
        name: zkevm_requests_per_second
      describedObject:
        apiVersion: v1
        kind: Service
        name: zkevm-service
      target:
        type: Value
        value: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 5
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zkevm-analyzer-hpa
  namespace: zkevm-system
  labels:
    app.kubernetes.io/name: zkevm
    app.kubernetes.io/component: analyzer-autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zkevm-analyzer-deployment
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  # Custom metric for analysis queue depth
  - type: Pods
    pods:
      metric:
        name: zkevm_analysis_queue_depth_per_pod
      target:
        type: AverageValue
        averageValue: "5"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 20
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
