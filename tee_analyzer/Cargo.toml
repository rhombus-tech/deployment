[package]
name = "tee_analyzer"
version = "0.1.0"
edition = "2021"
description = "WebAssembly Determinism Analyzer for TEE Execution"
authors = ["TEE Security Team"]

[dependencies]
walrus = "0.19.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ark-ff = "0.4.2"
ark-std = "0.4.0"
ark-relations = "0.4.0"
wat = "1.0"
tracing = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmparser = "0.100.0"
