apiVersion: v1
kind: ConfigMap
metadata:
  name: trustless-config
  namespace: trustless-production
data:
  server.toml: |
    # Trustless Proving Server Configuration
    
    [server]
    address = "0.0.0.0:3000"
    workers = 4
    max_connections = 1000
    
    [fractal]
    enabled = true
    discovery_mode = "auto"
    phi_optimization = true
    
    [proving]
    zoda_threshold = 16
    warp_accumulation = 10
    max_parallel = 4
    
    [rate_limiting]
    enabled = true
    max_requests_per_second = 100
    burst_size = 200
    
    [metrics]
    enabled = true
    endpoint = "/metrics"
    
    [logging]
    level = "info"
    format = "json"
---
apiVersion: v1
kind: Namespace
metadata:
  name: trustless-production
  labels:
    name: trustless-production
    environment: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trustless-proving
  namespace: trustless-production
---
apiVersion: v1
kind: Secret
metadata:
  name: trustless-secrets
  namespace: trustless-production
type: Opaque
stringData:
  eth-rpc-url: "https://eth.llamarpc.com"  # Replace with your RPC
  # Add more secrets as needed
