apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trustless-proving-ingress
  namespace: trustless-production
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - prover.trustless.network
    - api.trustless.network
    secretName: trustless-tls
  rules:
  - host: prover.trustless.network
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: trustless-proving-server
            port:
              number: 80
  - host: api.trustless.network
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: trustless-proving-server
            port:
              number: 80
