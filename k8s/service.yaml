apiVersion: v1
kind: Service
metadata:
  name: trustless-proving-server
  namespace: trustless-production
  labels:
    app: trustless-proving
    component: server
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: trustless-proving
    component: server
---
apiVersion: v1
kind: Service
metadata:
  name: trustless-proving-headless
  namespace: trustless-production
  labels:
    app: trustless-proving
    component: server
spec:
  clusterIP: None
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: trustless-proving
    component: server
