[package]
name = "trustless-proving-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Your proving system
evm-verify = { path = "../evm-verify" }
zkevm-stateless-vm = { path = "../stateless-vm" }

# Web server
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "limit"] }
tower = { version = "0.4", features = ["limit", "timeout"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
