version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 211125768252.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -f Dockerfile.simple -t zkvm-live-fix:latest .
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker tag zkvm-live-fix:latest 211125768252.dkr.ecr.us-east-1.amazonaws.com/zkvm-proving-service:live-fix-$(date +%Y%m%d-%H%M%S)
      - docker push 211125768252.dkr.ecr.us-east-1.amazonaws.com/zkvm-proving-service:live-fix-$(date +%Y%m%d-%H%M%S)
