[package]
name = "verify"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "common",
    "test-wasm",
    "test-alkanes",
]

[features]
default = []
# Feature not implemented in pcd crate yet
# accumulation = ["pcd/accumulation"]

[dependencies]
# WASM parsing and analysis
wasmparser = "0.110.0"
walrus = "0.19.0"

# Cryptographic proof systems
ark-ff = "0.4.0"
ark-ec = "0.4.0"
ark-bls12-381 = "0.4.0"
ark-std = "0.4.0"
ark-serialize = "0.4.0"
ark-relations = "0.4.0"
ark-r1cs-std = "0.4.0"
ark-groth16 = "0.4.0"
ark-snark = "0.4.0"
sha2 = "0.10.0"

# Error handling and utilities
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Workspace dependencies
common = { path = "./common" }
clap = { version = "4.5", features = ["derive"] }
num-traits = "0.2.19"
hex = "0.4.3"
wast = "230.0.0"
wasmer = "3.1.0"

# Williams compression dependencies
rand = "0.8.5"
flate2 = "1.0.28"

# English contract translation dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3.8"
dotenv = "0.15"

[dev-dependencies]
wat = "1.0"  # For parsing WAT in tests
proptest = "1.1.0"
criterion = "0.4.0"

# Benchmark file doesn't exist yet
# [[bench]]
# name = "wasm_analysis"
# harness = false

[[bin]]
name = "test_alkanes_verification"
path = "test_alkanes_verification.rs"

[[bin]]
name = "williams_demo"
path = "examples/simple_williams_demo.rs"

[[bin]]
name = "english_contract_demo"
path = "examples/english_contract_demo.rs"

[[bin]]
name = "english-contract"
path = "src/bin/english_contract.rs"
