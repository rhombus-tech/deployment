# FRAC RPC - Nginx Load Balancer Configuration
# Handles HTTPS, load balancing, and DDoS protection

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=burst_limit:10m rate=500r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream FRAC RPC Backends
    upstream frac_rpc_backend {
        least_conn;  # Load balance based on least connections
        
        # Primary FRAC RPC instances
        server frac-rpc:8545 max_fails=3 fail_timeout=30s;
        
        # Add more replicas for scaling:
        # server frac-rpc-2:8545 max_fails=3 fail_timeout=30s;
        # server frac-rpc-3:8545 max_fails=3 fail_timeout=30s;
        
        keepalive 32;
    }

    # HTTP Server (redirect to HTTPS)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server (Main RPC Endpoint)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name rpc.frac.network;  # Change to your domain

        # SSL Configuration
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # DDoS Protection
        limit_req zone=rpc_limit burst=20 nodelay;
        limit_req zone=burst_limit burst=50 nodelay;
        limit_conn conn_limit 10;
        
        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Main RPC Endpoint
        location / {
            # CORS Headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age "3600" always;

            # Handle preflight requests
            if ($request_method = OPTIONS) {
                return 204;
            }

            # Only allow POST for RPC, GET for health/stats
            if ($request_method !~ ^(GET|POST|OPTIONS)$) {
                return 405;
            }

            # Proxy to backend
            proxy_pass http://frac_rpc_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Health Check (no rate limiting)
        location /health {
            access_log off;
            proxy_pass http://frac_rpc_backend/health;
            proxy_set_header Host $host;
        }

        # Metrics Endpoint (restricted)
        location /metrics {
            # Restrict to local network only
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://frac_rpc_backend/metrics;
            proxy_set_header Host $host;
        }

        # Stats Endpoint (public)
        location /stats {
            limit_req zone=rpc_limit burst=5 nodelay;
            proxy_pass http://frac_rpc_backend/stats;
            proxy_set_header Host $host;
        }

        # Proving Endpoints
        location ~ ^/v1/proving/ {
            limit_req zone=rpc_limit burst=10 nodelay;
            
            proxy_pass http://frac_rpc_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Longer timeout for proving endpoints
            proxy_read_timeout 600s;
        }
    }

    # Monitoring/Admin Interface (Internal Only)
    server {
        listen 9090;
        server_name _;

        # Restrict to local network
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        location / {
            proxy_pass http://frac_rpc_backend:9090;
            proxy_set_header Host $host;
        }
    }
}
